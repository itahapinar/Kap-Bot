  "proje finansman", "finansman sağla", "finansman temin", "kredi kullan", "kredi temin",
  "sendikasyon",
  # sermaye artırımı ("Genel" başlıkla yapılan duyurular için)
  "sermaye artırım", "sermaye arttırım", "sermaye artışı", "tahsisli", "bedelli", "bedelsiz",
  "sermaye avans",
]

# Bu ifadelerden biri geçerse anahtar kelime olsa bile gönderilmez.
